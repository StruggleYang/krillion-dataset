name: daily update

on:
  schedule:
    # 13:30 UTC — after the daily dive resets (midnight US Eastern) and the
    # public answer sheet becomes available
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new dives
        run: python scripts/update.py

      - name: Commit new data
        run: |
          git config user.name "krillionhq-bot"
          git config user.email "bot@krillionhq.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data — nothing to commit"
          else
            git commit -m "data: daily update $(date -u +%Y-%m-%d)"
            git push
          fi
